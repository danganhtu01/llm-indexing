name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in step with `rust-version` in Cargo.toml and the builder image in
      # the Dockerfile (both 1.88). Pinned below the MSRV, this job could not
      # even resolve dependencies — built@0.8.1 requires 1.87 and the icu_*
      # crates require 1.86 — so `main` was red without any code being wrong.
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # poppler-utils (pdfinfo/pdftotext) ONLY. Two tests do real PDF
      # extraction through the actual pipeline with no availability guard:
      # tests/indexing.rs page_boundaries_survive_from_pdf_extraction_into_stored_chunks
      # (:642) and an_unanchored_corpus_regains_its_page_anchors_on_an_ordinary_resume
      # (:1077) both call extract::pdf on a handcrafted PDF and assert on the
      # result, so without pdfinfo/pdftotext on PATH they fail outright rather
      # than skip. The other PDF tests in this file (the encrypted-PDF ones)
      # self-skip via a local `pdfinfo_available()` check (tests/indexing.rs:958),
      # which is why this job was ever green at all despite having no apt step.
      # The `container` job below is unaffected by this gap: it builds and
      # runs the Dockerfile image, whose runtime stage installs poppler-utils
      # (Dockerfile:32) along with everything else the shipped binary needs.
      #
      # Deliberately NOT installing tesseract/ffmpeg/antiword/imagemagick here:
      # this job runs `cargo test`, not the Dockerfile image, and several
      # tests key their behavior off runtime tool detection rather than a
      # fixed fixture set — e.g. extract.rs's `ffmpeg_available()` (~:1229)
      # and the `transcriber.available()` capability gate it feeds (~:447).
      # Those currently pass by cleanly hitting the "tool absent" branch;
      # installing the tool would silently switch them onto a different,
      # unreviewed code path. Broadening this step is a separate change.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: cargo test --locked

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag llm-indexing:test .
      - name: Verify runtime and OCR languages
        run: |
          test "$(docker run --rm --entrypoint id llm-indexing:test -u)" = "10001"
          docker run --rm --entrypoint tesseract llm-indexing:test --list-langs | grep -Fx eng
          docker run --rm --entrypoint tesseract llm-indexing:test --list-langs | grep -Fx vie
      - name: Smoke test the job service
        run: |
          mkdir -p input output
          printf 'Know your customer at ngan hang.\n' > input/sample.txt
          chmod 777 output
          docker run -d --name indexer -p 127.0.0.1:9801:9801 \
            -v "$PWD/input:/input:ro" -v "$PWD/output:/output" llm-indexing:test
          ready=false
          for attempt in $(seq 1 30); do
            if docker run --rm --network host llm-indexing:test request --ping; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker run --rm --network host llm-indexing:test request \
            --output corpus.sqlite --overwrite
          test -f output/corpus.sqlite
          docker run --rm -v "$PWD/output:/output:ro" llm-indexing:test \
            search "ngan hang" --index /output/corpus.sqlite
          docker rm -f indexer
